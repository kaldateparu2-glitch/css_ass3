<!DOCTYPE html>
<html>
<head>
    <title>Display Properties</title>
    <style>
        body {
            background-color: #f0f0f0;
            text-align: center;
        }
        h1 {
            color: blue;
        }
        .block {
            background-color: tomato;
            padding: 15px;
            margin: 10px;
        }
        .inline {
            background-color: rgb(100, 200, 100);
            padding: 10px;
            margin: 5px;
        }
        .inlineblock {
            background-color: #ffcc00;
            display: inline;
            width: 150px;
            height: 80px;
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>CSS Display Properties</h1>
    <h2>Block Elements</h2>
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>
    <div class="block">Block 3</div>
    <h2>Inline Elements</h2>
    <div class="inline">Inline 1</div>
    <div class="inline">Inline 2</div>
    <h2>Inline-Block Elements</h2>
    <div class="inlineblock">Box 1</div>
    <div class="inlineblock">Box 2</div>
    <div class="inlineblock">Box 3</div>
</body>
</html>
